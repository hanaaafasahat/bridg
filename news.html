<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرفی اساتید | بریجینو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="navbar.js"></script>
<!-- معرفی اساتید -->
<style>
body, button, .news-modal-overlay, .news-modal { font-family: 'Vazirmatn', sans-serif; }
.news-section {
  background: #F8F9FA;
  padding: 100px 0;
  font-family: 'Vazirmatn', sans-serif;
  direction: rtl;
}
.news-container {
  max-width: 1180px; margin: 0 auto; padding: 0 5vw;
  display: flex; flex-direction: column; gap: 48px;
}

/* تیتر */
.news-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.news-title { font-size: 36px; font-weight: 700; color: #1A1A2E; margin: 0; }
.news-divider { width: 60px; height: 3px; border-radius: 2px; background: linear-gradient(90deg,#1A3A6E,#C0392B); }
.news-sub { font-size: 17px; color: #4A5568; }

/* بدنه */
.news-body {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  align-items: start;
}

/* ── کارت اساتید ── */
.news-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.news-item {
  display: flex; gap: 14px; align-items: center;
  background: #fff; border: 1px solid #E0E0E0;
  border-radius: 12px; padding: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  transition: box-shadow 0.3s, transform 0.3s;
  cursor: pointer; text-decoration: none;
  width: 100%; text-align: right;
  font-family: 'Vazirmatn', sans-serif;
}
.news-item:hover {
  box-shadow: 0 4px 16px rgba(26,58,110,0.10);
  transform: translateX(-4px);
}

/* عکس مربعی استاد (بدون پس‌زمینه رنگی/فیلتر) */
.news-thumb {
  width: 90px; height: 90px; border-radius: 8px;
  flex-shrink: 0; overflow: hidden;
  background: #EDEFF2;
}
.news-thumb img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}

.news-item-text { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.news-item-badge {
  display: inline-block; width: fit-content;
  padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 700;
  background: #EEF4FF; color: #1A3A6E;
}

.news-item-title {
  font-size: 14px; font-weight: 700; color: #1A1A2E;
  line-height: 1.5;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-clamp: 2;
}
.news-item-date { font-size: 11.5px; color: #8A8F98; }

/* انیمیشن */
.s7-anim { opacity: 0; transform: translateY(36px); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); }
.s7-anim.slide-r { transform: translateX(36px); }
.s7-anim.slide-l { transform: translateX(-36px); }
.s7-anim.visible { opacity: 1; transform: translate(0); }

/* Responsive */
@media (max-width: 768px) {
  .news-title { font-size: 26px; }
  .news-list { grid-template-columns: 1fr; }
  .news-thumb { width: 80px; height: 80px; }
}

/* ── مودال معرفی کامل استاد ── */
.news-modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(13,33,69,0.55);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.news-modal-overlay.open { opacity: 1; pointer-events: auto; }

.news-modal {
  background: #fff; border-radius: 16px;
  max-width: 560px; width: 100%;
  max-height: 85vh; overflow-y: auto;
  padding: 32px; position: relative;
  transform: translateY(24px) scale(0.97);
  transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.news-modal-overlay.open .news-modal { transform: translateY(0) scale(1); }

.news-modal-close {
  position: absolute; top: 18px; left: 18px;
  width: 34px; height: 34px; border-radius: 50%;
  border: none; background: #F1F3F5; color: #4A5568;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s;
}
.news-modal-close:hover { background: #E2E8F0; }

.news-modal-head {
  display: flex; align-items: center; gap: 16px; margin-bottom: 18px;
}
.news-modal-thumb {
  width: 96px; height: 96px; border-radius: 10px; flex-shrink: 0;
  overflow: hidden; background: #EDEFF2;
}
.news-modal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.news-modal-badge {
  display: inline-block; width: fit-content;
  padding: 3px 10px; border-radius: 10px;
  font-size: 11px; font-weight: 700; margin-bottom: 6px;
  background: #EEF4FF; color: #1A3A6E;
}
.news-modal-date { font-size: 12.5px; color: #8A8F98; }

.news-modal-title {
  font-size: 20px; font-weight: 700; color: #1A1A2E;
  line-height: 1.5; margin: 0 0 16px;
}
.news-modal-content {
  font-size: 14.5px; line-height: 2; color: #4A5568;
}
</style>

<section class="news-section" id="news-section">
  <div class="news-container">

    <!-- تیتر -->
    <div class="news-header s7-anim">
      <h2 class="news-title">معرفی اساتید بریجینو</h2>
      <div class="news-divider"></div>
      <p class="news-sub">با اساتید باتجربه آکادمی زبان بریجینو آشنا شوید</p>
    </div>

    <!-- بدنه -->
    <div class="news-body">

      <div class="news-list">

        <!-- شیما یاهو -->
        <button type="button" class="news-item s7-anim slide-l"
          data-img="images/shima-yahoo.jpg"
          data-badge="مدرس نوجوان و بزرگسال"
          data-title="شیما یاهو" data-date="۳ سال سابقه تدریس"
          data-content="شیما یاهو با پیشینه‌ی تحصیلی در رشته‌ی سلولی و مولکولی، سه سال است که زبان انگلیسی تدریس می‌کند. او در بریجینو همراه نوجوانان و بزرگسالانی است که می‌خواهند زبان را با انگیزه و اعتمادبه‌نفس یاد بگیرند و از مسیر یادگیری لذت ببرند.">
          <div class="news-thumb"><img src="images/shima-yahoo.jpg" alt="شیما یاهو"></div>
          <div class="news-item-text">
            <span class="news-item-badge">مدرس نوجوان و بزرگسال</span>
            <div class="news-item-title">شیما یاهو</div>
            <span class="news-item-date">۳ سال سابقه تدریس</span>
          </div>
        </button>

        <!-- سوگند مالکی -->
        <button type="button" class="news-item s7-anim slide-l"
          data-img="images/sogand-maleki.jpg"
          data-badge="مدرس کودک و نوجوان"
          data-title="سوگند مالکی" data-date="۳ سال سابقه تدریس"
          data-content="سوگند مالکی که دانش‌آموخته‌ی زبان آلمانی است، سه سال است که هم انگلیسی و هم آلمانی تدریس می‌کند. کلاس‌های او برای کودکان و نوجوانان فضایی شاد و پرانرژی دارد تا یادگیری زبان برایشان یک بازی دوست‌داشتنی باشد.">
          <div class="news-thumb"><img src="images/sogand-maleki.jpg" alt="سوگند مالکی"></div>
          <div class="news-item-text">
            <span class="news-item-badge">مدرس کودک و نوجوان</span>
            <div class="news-item-title">سوگند مالکی</div>
            <span class="news-item-date">۳ سال سابقه تدریس</span>
          </div>
        </button>

        <!-- کیمیا کلانتری -->
        <button type="button" class="news-item s7-anim slide-l"
          data-img="images/kimia-kalantari.jpg"
          data-badge="مدرس کودک و نوجوان"
          data-title="کیمیا کلانتری" data-date="۵ سال سابقه تدریس"
          data-content="کیمیا کلانتری مترجم زبان انگلیسی است و پنج سال تجربه‌ی تدریس دارد. او در کلاس‌های کودکان و نوجوانان بریجینو با صبر و روحیه‌ی مثبت کنار بچه‌ها می‌ماند تا قدم‌به‌قدم زبان را بشناسند و از حرف زدن به انگلیسی نترسند.">
          <div class="news-thumb"><img src="images/kimia-kalantari.jpg" alt="کیمیا کلانتری"></div>
          <div class="news-item-text">
            <span class="news-item-badge">مدرس کودک و نوجوان</span>
            <div class="news-item-title">کیمیا کلانتری</div>
            <span class="news-item-date">۵ سال سابقه تدریس</span>
          </div>
        </button>

        <!-- نسرین ابراهیمی -->
        <button type="button" class="news-item s7-anim slide-l"
          data-img="images/nasrin-ebrahimi.jpg"
          data-badge="مدرس کودک و نوجوان"
          data-title="نسرین ابراهیمی" data-date="۴ سال سابقه تدریس"
          data-content="نسرین ابراهیمی کارشناس آموزش ابتدایی از دانشگاه فرهنگیان است و چهار سال تجربه‌ی تدریس زبان انگلیسی دارد. نگاه آموزشی او به کودکان باعث می‌شود کلاس‌هایش صمیمی، منظم و پر از تشویق باشد.">
          <div class="news-thumb"><img src="images/nasrin-ebrahimi.jpg" alt="نسرین ابراهیمی"></div>
          <div class="news-item-text">
            <span class="news-item-badge">مدرس کودک و نوجوان</span>
            <div class="news-item-title">نسرین ابراهیمی</div>
            <span class="news-item-date">۴ سال سابقه تدریس</span>
          </div>
        </button>

      </div>
    </div>

  </div>
</section>

<!-- مودال نمایش معرفی کامل استاد -->
<div class="news-modal-overlay" id="news-modal-overlay">
  <div class="news-modal">
    <button type="button" class="news-modal-close" id="news-modal-close" aria-label="بستن">
      <i class="ti ti-x"></i>
    </button>
    <div class="news-modal-head">
      <div class="news-modal-thumb"><img id="news-modal-img" src="" alt=""></div>
      <div>
        <span class="news-modal-badge" id="news-modal-badge"></span><br>
        <span class="news-modal-date" id="news-modal-date"></span>
      </div>
    </div>
    <h3 class="news-modal-title" id="news-modal-title"></h3>
    <p class="news-modal-content" id="news-modal-content"></p>
  </div>
</div>

<script>
(function(){
  // IntersectionObserver
  const els = document.querySelectorAll('.s7-anim');
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 90);
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  els.forEach(el => io.observe(el));

  // مودال
  const overlay = document.getElementById('news-modal-overlay');
  const modalImg = document.getElementById('news-modal-img');
  const modalBadge = document.getElementById('news-modal-badge');
  const modalDate = document.getElementById('news-modal-date');
  const modalTitle = document.getElementById('news-modal-title');
  const modalContent = document.getElementById('news-modal-content');

  document.querySelectorAll('.news-item').forEach(item => {
    item.addEventListener('click', () => {
      modalImg.src = item.dataset.img;
      modalImg.alt = item.dataset.title;
      modalBadge.textContent = item.dataset.badge;
      modalDate.textContent = item.dataset.date;
      modalTitle.textContent = item.dataset.title;
      modalContent.textContent = item.dataset.content;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('news-modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
})();
</script>

</body>
</html>
